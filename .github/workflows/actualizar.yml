name: Actualizar precios

on:
  schedule:
    # Lunes a viernes a las 20:17 de Argentina (23:17 UTC), después del cierre
    - cron: "17 23 * * 1-5"
    # Y a las 8:00 de Argentina (11:00 UTC) de martes a sábado: para entonces CAFCI ya
    # publicó la planilla del día anterior (los fondos se actualizan con esta corrida)
    - cron: "0 11 * * 2-6"
  workflow_dispatch: {}   # botón "Run workflow" en la pestaña Actions de GitHub

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bajar y guardar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          PPI_PUBLIC_KEY: ${{ secrets.PPI_PUBLIC_KEY }}
          PPI_PRIVATE_KEY: ${{ secrets.PPI_PRIVATE_KEY }}
        run: python scripts/actualizar.py
